<div class="home-container">
  <div class="home-card">
    <div class="home-header">
      <div class="avatar">
        <span>{{ userEmail ? userEmail[0].toUpperCase() : '?' }}</span>
      </div>
      <h1>Bem-vindo ao Sistema</h1>
      <p class="user-email">{{ userEmail }}</p>
      <div class="role-badge" [class.badge-admin]="isAdmin" [class.badge-user]="!isAdmin">
        {{ userRole }}
      </div>
    </div>

    <div class="home-body" *ngIf="isAdmin">
      <a routerLink="/admin" class="btn-admin">Acessar Painel Admin →</a>
    </div>

    <div class="home-footer">
      <button class="btn-logout" (click)="logout()">Sair da conta</button>
    </div>
  </div>
</div>

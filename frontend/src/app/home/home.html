<div class="home-container">
  <div class="home-card">
    <div class="home-header">
      <div class="avatar">
        <span>{{ userEmail ? userEmail[0].toUpperCase() : '?' }}</span>
      </div>
      <h1>Bem-vindo ao SGR</h1>
      <p class="user-email">{{ userEmail }}</p>
      <div class="role-badge" [class.badge-admin]="isAdmin" [class.badge-user]="!isAdmin">
        {{ userRole }}
      </div>
    </div>

    <div class="home-body">
      <h2 class="section-title">Acesso Rápido</h2>
      <div class="actions-grid">
        <a routerLink="/recursos" class="action-card">
          <span class="action-icon">📂</span>
          <span class="action-label">Recursos Disponíveis</span>
        </a>
        <a routerLink="/disponibilidade" class="action-card">
          <span class="action-icon">🔍</span>
          <span class="action-label">Consultar Disponibilidade</span>
        </a>
        <a routerLink="/minhas-reservas" class="action-card">
          <span class="action-icon">📋</span>
          <span class="action-label">Minhas Reservas</span>
        </a>
        <a routerLink="/admin" class="action-card action-admin" *ngIf="isAdmin">
          <span class="action-icon">⚙️</span>
          <span class="action-label">Painel Admin</span>
        </a>
      </div>
    </div>

    <div class="home-footer">
      <button class="btn-logout" (click)="logout()">Sair da conta</button>
    </div>
  </div>
</div>
